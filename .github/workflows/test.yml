# SPDX-License-Identifier: GPL-2.0-or-later
name: test

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tier 1 and the structural checks: no QGIS, no engines, seconds to run.
  # This is the gate that proves the QGIS-free core boundary is real rather
  # than aspirational (NFR-002), so it runs on every OS.
  core:
    name: core (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install tooling
        # NumPy is a hard dependency: it ships with QGIS and the geodetic core
        # uses it from phase P1 onward (specs/03-architecture.md section 3.7).
        #
        # openpyxl is a *test* dependency and not a runtime one. GeoComp writes
        # .xlsx with its own writer (specs/17 section 5.1), and openpyxl is here
        # to read that file back with an independent implementation -- the only
        # way to know the workbook is valid rather than merely self-consistent.
        # The "degraded environments" job deliberately omits it, which is what
        # proves the export does not need it.
        run: python -m pip install --upgrade pip pytest ruff numpy openpyxl

      - name: Lint
        run: ruff check .

      - name: Tier 1 and structural checks
        run: pytest -q

      - name: The plugin package must import without QGIS
        run: python -c "import geocomp; print(geocomp.__version__)"

  # Phase P11: the PostGIS store against a real PostGIS. specs/17 criterion 1 --
  # GeoPackage -> PostGIS -> GeoPackage with every table identical -- needs a
  # server, which P5 had nowhere to run; a service container is one. The tests
  # skip without GEOCOMP_TEST_POSTGRES, so the second step fails the job if any
  # of them did: a PostGIS check that silently skipped would be a green tick for
  # nothing.
  postgis:
    name: postgis store
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: pw-ci-6b2f0e-never-logged
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GEOCOMP_TEST_POSTGRES: host=localhost port=5432 dbname=postgres user=postgres password=pw-ci-6b2f0e-never-logged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest numpy psycopg2-binary

      - name: The store on PostGIS, and the store on GeoPackage beside it
        run: |
          set -o pipefail
          python -m pytest -q -rs tests/test_postgis_store.py tests/test_project_store.py | tee pytest.log

      - name: None of the PostGIS tests may have skipped
        run: |
          if grep -q "SKIPPED" pytest.log; then
            echo "::error::PostGIS tests skipped although a server was provided"
            exit 1
          fi

  # FR-090 / FR-091: an untranslated string fails the build at the commit that
  # introduces it, not at release.
  translations:
    name: translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check catalogue completeness
        run: python scripts/update_translations.py --check

      - name: Catalogues must be up to date with the sources
        run: |
          python scripts/update_translations.py
          if ! git diff --quiet -- geocomp/i18n; then
            echo "::error::Translation catalogues are stale. Run: python3 scripts/update_translations.py"
            git diff --stat -- geocomp/i18n
            exit 1
          fi

  # specs/21 criterion 5: the QGIS tier on the current stable and the current
  # LTR -- of the 4.x series, ADR-0007. Which releases those are is read from
  # the QGIS images' own tags each time this runs, not written here: on the day
  # this was written ``ltr`` was 3.44, which the plugin's minimum refuses, and
  # the LTR joins the matrix when it is a 4.x release. A channel that cannot be
  # resolved fails this job; it does not quietly shrink the matrix.
  qgis-versions:
    name: QGIS releases under test
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve stable and LTR to releases
        id: resolve
        run: python scripts/qgis_versions.py

  # Tier 3: the parts that need a real QGIS. Runs in the official container,
  # on the release tag rather than the moving one, so the QGIS version is
  # explicit -- in the job's name too -- rather than whatever a tag pointed at.
  qgis:
    name: qgis integration (Linux, QGIS ${{ matrix.qgis }}, ${{ matrix.channel }})
    needs: qgis-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.qgis-versions.outputs.matrix) }}
    container:
      image: qgis/qgis:${{ matrix.qgis }}
    # P11: a PostGIS for the database-mode tests, reached by its service name
    # from inside the container. Its password differs from every name the
    # tests use, so the leak assertions (NFR-010) cannot match by accident.
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: pw-ci-6b2f0e-never-logged
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GEOCOMP_TEST_POSTGRES: host=postgis port=5432 dbname=postgres user=postgres password=pw-ci-6b2f0e-never-logged
    steps:
      - uses: actions/checkout@v4

      - name: Install test tooling
        run: |
          pip3 install --break-system-packages pytest
          # The PostgreSQL driver QGIS's Python tools use; installed only if
          # this image lacks it, and reported below either way.
          python3 -c "import psycopg2" 2>/dev/null || pip3 install --break-system-packages psycopg2-binary
          # SciPy, for the sparse adjustment path (NFR-008, ADR-0008): its tests
          # and the --sparse run below need it. Installed only if the image
          # lacks it; the core jobs and the degraded job stay without it.
          python3 -c "import scipy" 2>/dev/null || pip3 install --break-system-packages scipy
          # coverage, to measure core/ during the full suite below (specs/20
          # criterion 6).
          python3 -c "import coverage" 2>/dev/null || pip3 install --break-system-packages coverage

      # Each of these fails on its own line rather than inside the test run, so
      # a broken environment is distinguishable from a broken plugin. This job
      # spent ten runs failing in four seconds -- before a single test ran --
      # and reporting that as though the suite had run and failed.
      - name: Report the environment under test
        run: |
          # The image is the release the matrix names, or this job tests
          # something other than what its name says.
          python3 scripts/qgis_versions.py --check "${{ matrix.qgis }}" --exact
          python3 -c "import numpy; print('numpy', numpy.__version__)"
          python3 -c "import pytest; print('pytest', pytest.__version__)"
          python3 -c "import psycopg2; print('psycopg2', psycopg2.__version__)"
          python3 -c "import scipy; print('scipy', scipy.__version__)"
          python3 -c "import geocomp; print('geocomp', geocomp.__version__)"

      - name: Collect the suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m pytest -q --collect-only | tail -3

      # A crash inside addAlgorithm takes the process down and the traceback
      # names loadAlgorithms, not the algorithm being added -- so every tier-3
      # test fails at once and none of them says which one is at fault. This
      # walks the registry printing as it goes, so the last line before an abort
      # names the culprit. It must not gate the suite: when it passes there is
      # nothing to report, and when it aborts the suite's own failure is the one
      # that matters.
      - name: Name the algorithm that breaks the provider, if any
        if: always()
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a python3 scripts/diagnose_provider.py

      # ``xvfb-run`` when the image has it, the offscreen platform alone when it
      # does not: some Qt paths still want an X server even with the offscreen
      # platform set, and a QGIS image without xvfb is not a reason to skip the
      # whole suite.
      - name: Full suite with QGIS available
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          # Under coverage of core/: this is the run with QGIS, SciPy and PostGIS
          # all present, so it is the one that reaches the most of the core.
          if command -v xvfb-run >/dev/null 2>&1; then
            echo "running under xvfb-run"
            xvfb-run -a python3 -m coverage run --source=geocomp/core -m pytest -ra --tb=short 2>&1 | tee pytest.log
          else
            echo "xvfb-run not present; offscreen platform only"
            python3 -m coverage run --source=geocomp/core -m pytest -ra --tb=short 2>&1 | tee pytest.log
          fi

      # specs/20 criterion 6: coverage of core/ measured and reported, and
      # every public function in it reached by at least one test.
      - name: Coverage of core/, and every public function reached
        run: |
          python3 -m coverage report --sort=cover | tail -25
          python3 -m coverage report > coverage.txt
          python3 scripts/check_coverage.py

      # The database-mode tests skip without a server; here there is one, so a
      # skip means the service or the driver failed, not that there was nothing
      # to test.
      - name: The PostGIS tests ran here too
        run: |
          if grep -E "SKIPPED.*test_postgis" pytest.log; then
            echo "::error::PostGIS tests skipped in the QGIS job although a server was provided"
            exit 1
          fi

      # The sparse path's own tests skip without SciPy; here it is installed, so
      # a skip means it is not.
      - name: The sparse adjustment tests ran here
        run: |
          if grep -E "SKIPPED.*test_sparse_adjustment" pytest.log; then
            echo "::error::the sparse adjustment tests skipped although SciPy was installed"
            exit 1
          fi

      # NFR-008: the whole suite again with every adjustment on the sparse
      # path, however small. Anything that reads the run's matrices as dense
      # arrays fails here rather than on the first network large enough to take
      # that path. Tests that read what only the dense path forms are marked
      # dense_only and skip.
      - name: Full suite with every adjustment on the sparse path
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a python3 -m pytest -q --sparse --tb=short 2>&1 | tee pytest-sparse.log
          else
            python3 -m pytest -q --sparse --tb=short 2>&1 | tee pytest-sparse.log
          fi

      # A crash exits before pytest prints anything, and the run log is not
      # reachable from every tool that reads this repository's CI. The log is an
      # artifact so the failure can be read rather than guessed at -- which is
      # how this job stayed red for ten runs.
      - name: Keep the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qgis-pytest-log-${{ matrix.qgis }}
          path: |
            pytest.log
            pytest-sparse.log
            coverage.txt
          if-no-files-found: warn

  # specs/21 criterion 5 on Windows and macOS: the whole suite under the QGIS a
  # user installs there, in that QGIS's own Python -- OSGeo4W's on Windows, the
  # official bundle (through its Homebrew cask) on macOS. Tier 1 has run on
  # both since P0, but on python.org's Python with PyPI's NumPy, which is not
  # what the plugin is loaded into.
  #
  # The releases are the Linux job's, by channel: stable is OSGeo4W's ``qgis``
  # and the ``qgis`` cask, the LTR ``qgis-ltr`` and ``qgis@ltr``. These can
  # trail the image by a patch release, which is reported; another release
  # line fails, since the job would not be testing the channel it names.
  #
  # Not here: PostGIS, since service containers exist on Linux runners only
  # (the Linux job runs those tests against a server); and, on Windows, the
  # engine-installation tests, whose stand-in engine is shell scripts -- the
  # engine workflow installs and runs the real Windows archive.
  qgis-windows:
    name: qgis integration (Windows, QGIS ${{ matrix.qgis }}, ${{ matrix.channel }})
    needs: qgis-versions
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.qgis-versions.outputs.matrix) }}
    env:
      PACKAGE: ${{ startsWith(matrix.channel, 'stable') && 'qgis' || 'qgis-ltr' }}
      LAUNCHER: ${{ startsWith(matrix.channel, 'stable') && 'python-qgis.bat' || 'python-qgis-ltr.bat' }}
    steps:
      - uses: actions/checkout@v4

      # OSGeo4W's network installer, unattended. pytest and SciPy are OSGeo4W
      # packages, built for its Python and NumPy, not wheels from PyPI.
      - name: Install QGIS from OSGeo4W
        run: |
          Invoke-WebRequest https://download.osgeo.org/osgeo4w/v2/osgeo4w-setup.exe -OutFile osgeo4w-setup.exe
          $p = Start-Process -FilePath .\osgeo4w-setup.exe -Wait -PassThru -ArgumentList '-q','-k','-r','-A','-s','https://download.osgeo.org/osgeo4w/v2/','-R','C:\OSGeo4W','-l','C:\osgeo4w-cache','-P',"$env:PACKAGE,python3-pytest,python3-scipy"
          if ($p.ExitCode -ne 0) { throw "osgeo4w-setup exited with $($p.ExitCode)" }

      # The launcher sets up QGIS's environment and replaces PATH, so nothing
      # outside OSGeo4W runs after it in the same step: each of these is a step
      # of its own, and the log is read from Git's bash.
      - name: The QGIS under test
        shell: cmd
        run: call C:\OSGeo4W\bin\%LAUNCHER% scripts\qgis_versions.py --check ${{ matrix.qgis }}

      - name: The whole suite, in QGIS's Python
        shell: cmd
        env:
          QT_QPA_PLATFORM: offscreen
        run: call C:\OSGeo4W\bin\%LAUNCHER% -m pytest -q -ra --tb=short -p no:cacheprovider > pytest.log 2>&1

      - name: The test log
        if: always()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR)" pytest.log || true
          tail -n 250 pytest.log

      - name: Nothing skipped for want of QGIS or SciPy
        shell: bash
        run: |
          if grep -E "SKIPPED.*(requires a QGIS runtime|SciPy not installed|test_sparse_adjustment)" pytest.log; then
            echo "::error::tests skipped although QGIS and SciPy are installed"
            exit 1
          fi

  qgis-macos:
    name: qgis integration (macOS, QGIS ${{ matrix.qgis }}, ${{ matrix.channel }})
    needs: qgis-versions
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.qgis-versions.outputs.matrix) }}
    env:
      CASK: ${{ startsWith(matrix.channel, 'stable') && 'qgis' || 'qgis@ltr' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install QGIS
        run: brew install --cask "$CASK"

      # QGIS tells its bundled Python where its standard library is; started on
      # its own, that Python finds none, because the bundle keeps it, and
      # site-packages, in Contents/Resources/python3.X rather than under a
      # prefix. PYTHONPATH names them. PYTHONHOME is set too, though nothing is
      # found under it: without it, every Python started (the tests start some)
      # writes "Could not find platform independent libraries" to stderr.
      #
      # pytest is pure Python, installed for the bundle's Python version into
      # a directory of its own rather than into the signed bundle.
      - name: Reach the bundle's Python
        run: |
          app=$(ls -d /Applications/QGIS*.app | head -1)
          lib=$(dirname "$(find "$app/Contents/Resources" -maxdepth 2 -type d -name encodings | head -1)")
          python=$(ls "$app"/Contents/MacOS/python3.* | head -1)
          version=$(basename "$lib" | sed 's/^python//')
          python3 -m pip install --quiet --target "$RUNNER_TEMP/pytest" --python-version "$version" --only-binary=:all: pytest
          {
            echo "QGIS_PYTHON=$python"
            echo "QGIS_PYTHONHOME=$app/Contents"
            echo "QGIS_PYTHONPATH=$lib:$lib/site-packages:$lib/lib-dynload:$RUNNER_TEMP/pytest"
          } >> "$GITHUB_ENV"
          echo "QGIS at $app, Python $version at $python"

      - name: The QGIS under test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export PYTHONHOME="$QGIS_PYTHONHOME" PYTHONPATH="$QGIS_PYTHONPATH"
          "$QGIS_PYTHON" scripts/qgis_versions.py --check "${{ matrix.qgis }}"

      - name: The whole suite, in QGIS's Python
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          export PYTHONHOME="$QGIS_PYTHONHOME" PYTHONPATH="$QGIS_PYTHONPATH"
          "$QGIS_PYTHON" -m pytest -q -ra --tb=short -p no:cacheprovider 2>&1 | tee pytest.log

      - name: Nothing skipped for want of QGIS or SciPy
        run: |
          if grep -E "SKIPPED.*(requires a QGIS runtime|SciPy not installed|test_sparse_adjustment)" pytest.log; then
            echo "::error::tests skipped although QGIS and SciPy are installed"
            exit 1
          fi

  # NFR-005 and FR-306: the fallback paths are requirements, and an untested
  # fallback is a fallback that does not work.
  degraded:
    name: degraded environments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest numpy

      - name: No SciPy, no QGIS, no engines
        # SciPy is optional (ADR-0008): every computation has a NumPy-only path,
        # and a network too large for the dense one is refused by name
        # (tests/test_network_scale.py). An untested fallback is a fallback
        # that does not work.
        run: |
          python -c "import numpy; print('numpy', numpy.__version__)"
          python -c "
          import importlib.util, sys
          if importlib.util.find_spec('scipy'): sys.exit('scipy must be absent in this job')
          print('scipy absent, as intended')
          "
          pytest -q

      - name: No Qt linguist tools (the AST extractor must still work)
        run: python scripts/update_translations.py --check
