# SPDX-License-Identifier: GPL-2.0-or-later
#
# The provenance guard for RD-11 (specs/20 section 3, specs/22 section 2).
#
# `tests/data/krumm/` is 107 files copied verbatim from GNU Gama at a pinned
# commit, and `tests/data/krumm/PROVENANCE.md` says so. That claim is the whole
# basis on which the data is redistributed here: attribution to a source you
# have quietly edited is not attribution. So it is checked against a real clone
# rather than trusted.
#
# The adjustments themselves are **not** run here -- they are ordinary tier-2
# tests now that the data is in the tree, so `test` runs them on every commit,
# on every platform, with no network. This job only answers "are these still
# Gama's files?", which is the one question that needs the network.
name: reference

on:
  push:
    paths:
      - "tests/data/krumm/**"
      - "tests/data/rd06/**"
      - "scripts/check_rd06.py"
      - ".gitattributes"
      - "scripts/check_krumm_corpus.py"
      - "tests/data/rd07/**"
      - "scripts/check_rd07.py"
      - "scripts/check_tide_reference.py"
      - "tests/test_rd07.py"
      - "geocomp/core/techniques/gravimetry/**"
      - "geocomp/core/instruments/gravimeter.py"
      - "geocomp/io/gravimeter_files.py"
      - "geocomp/core/geodesy/frames.py"
      - "scripts/check_frames.py"
      - "tests/data/frames/**"
      - "tests/test_frames.py"
      - "geocomp/core/techniques/gnss/products.py"
      - "scripts/check_products.py"
      - ".github/workflows/reference.yml"
  pull_request:
    paths:
      - "tests/data/krumm/**"
      - "tests/data/rd06/**"
      - "scripts/check_rd06.py"
      - ".gitattributes"
      - "scripts/check_krumm_corpus.py"
      - "tests/data/rd07/**"
      - "scripts/check_rd07.py"
      - "scripts/check_tide_reference.py"
      - "tests/test_rd07.py"
      - "geocomp/core/techniques/gravimetry/**"
      - "geocomp/core/instruments/gravimeter.py"
      - "geocomp/io/gravimeter_files.py"
      - "geocomp/core/geodesy/frames.py"
      - "scripts/check_frames.py"
      - "tests/data/frames/**"
      - "tests/test_frames.py"
      - "geocomp/core/techniques/gnss/products.py"
      - "scripts/check_products.py"
      - ".github/workflows/reference.yml"
  # Upstream cannot change under a pinned commit, but a rewritten tag or a
  # vanished repository can, and finding that out at release time is worse.
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

concurrency:
  group: reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance:
    name: the vendored corpus is still GNU Gama's
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install: the checker is standard library and git alone, which is
      # deliberate -- a provenance check that needs a dependency resolved from
      # the network has more ways to be wrong than the thing it is checking.
      - name: Every vendored file must match the pinned upstream commit
        run: python3 scripts/check_krumm_corpus.py

      # These archives and station sheets can change or disappear upstream.
      # Check the frozen snapshot and its published-coordinate transcription;
      # the engine workflow separately enforces the live accuracy assertion.
      - name: RD-06 sources and official-coordinate transcription must match
        run: python3 scripts/check_rd06.py --verify-inputs

  # RD-07 (specs/22 section 5.6). Two of its references cannot be committed --
  # pyGrav states no licence, and the CG-5 survey came from it -- so they are
  # fetched here, at pinned commits, and refused if a digest differs. The
  # third is GeoComp's own ETERNA series, regenerated to prove it still is.
  rd07:
    name: gravimetry reproduces RD-07
    runs-on: ubuntu-latest
    env:
      PYGTIDE_VERSION: "0.9.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the tide reference and the test tooling
        run: python -m pip install --upgrade pip pytest numpy openpyxl "pygtide==$PYGTIDE_VERSION"
      - name: The committed ETERNA series is still ETERNA's
        run: python scripts/check_tide_reference.py
      - name: Fetch the CG-5 survey and pyGrav's solution, and compare
        run: python scripts/check_rd07.py --fetch "$RUNNER_TEMP/rd07"
      - name: RD-07 tests against the fetched references
        env:
          GEOCOMP_RD07_DATA: ${{ runner.temp }}/rd07
        run: python -m pytest -q -rs tests/test_rd07.py tests/test_gravimetry_tides.py tests/test_gravimetry_network.py

  # The frame transformations are GeoComp's own arithmetic on EPSG's
  # parameters (specs/13 section 5). PROJ is the independent implementation:
  # it transforms the same 303 points, and GeoComp -- and the committed
  # fixture the tier-1 test reads -- must agree with it to a micrometre, using
  # the same EPSG operation. pyproj is pinned so a new bundled PROJ is a
  # deliberate change rather than a surprise.
  frames:
    name: frame transformations agree with PROJ
    runs-on: ubuntu-latest
    env:
      PYPROJ_VERSION: "3.6.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PROJ's Python bindings and the test tooling
        run: python -m pip install --upgrade pip pytest numpy "pyproj==$PYPROJ_VERSION"
      - name: GeoComp and the committed fixture against a live PROJ
        run: python scripts/check_frames.py
      - name: The tier-1 frame tests
        run: python -m pytest -q tests/test_frames.py

  # GNSS product download (specs/08 section 5, phase P10c). The test suite
  # resolves products against a stub and a local server; this resolves RD-06's
  # two days from NOAA's open-data archive itself, through the same resolution
  # code, and requires the bytes RD-06 pinned and a second resolution that
  # makes no network call (specs/08 section 10 criterion 6). It is here, on a
  # schedule, because an archive renaming its files is found out on a quiet
  # Tuesday rather than in a user's failed batch.
  products:
    name: products resolve from the live archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy, which the core package imports
        run: python -m pip install --upgrade pip numpy
      - name: RD-06's products, from NOAA, match their pinned bytes
        run: python scripts/check_products.py
