# SPDX-License-Identifier: GPL-2.0-or-later
#
# RD-11: the published network adjustments (specs/20 section 3, specs/22 section 2).
#
# 33 worked examples from Ghilani, Niemeier, Benning, Wolf, Strang and Borre
# and others, each published with its adjusted coordinates, each reproduced by
# the in-house core to 0.05 mm. This is the project's only check against
# somebody else's published numbers rather than against its own previous
# output, so it runs in CI rather than living in a contributor's shell history.
#
# **Why it clones rather than vendors.** The data is GNU Gama's redistribution
# of Friedhelm Krumm's transcriptions from a dozen copyrighted textbooks, and
# GNU Gama's permission to carry them is not automatically GeoComp's. Vendoring
# is a maintainers' decision (THIRD_PARTY.md, specs/22 section 2.3); until it is
# made, the corpus is fetched at a pinned commit and the tests reach it by path.
name: reference

on:
  push:
    paths:
      - "geocomp/io/krumm.py"
      - "geocomp/core/adjustment/**"
      - "tests/test_krumm*.py"
      - ".github/workflows/reference.yml"
  pull_request:
    paths:
      - "geocomp/io/krumm.py"
      - "geocomp/core/adjustment/**"
      - "tests/test_krumm*.py"
      - ".github/workflows/reference.yml"
  workflow_dispatch:

concurrency:
  group: reference-${{ github.ref }}
  cancel-in-progress: true

env:
  # GNU Gama v2.24. specs/22 section 2 was written against this tree, and the
  # expected-outcome tables in tests/test_krumm_corpus.py enumerate its 61
  # files by name. Moving the pin means re-reading that table, not just bumping
  # the sha.
  GAMA_COMMIT: 963c3099054594922716786f92119732f12d714e

jobs:
  krumm:
    name: 33 published networks reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: python -m pip install --upgrade pip pytest numpy

      - name: Cache the corpus
        id: corpus-cache
        uses: actions/cache@v4
        with:
          path: krumm-corpus
          key: krumm-${{ env.GAMA_COMMIT }}

      - name: Fetch the example networks
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/Geo-Linux-Calculations/gnu-gama.git upstream
          git -C upstream sparse-checkout init --cone
          git -C upstream sparse-checkout set tests/krumm/input
          git -C upstream checkout --detach "$GAMA_COMMIT"
          mkdir -p krumm-corpus
          cp -a upstream/tests/krumm/input/. krumm-corpus/

      - name: Every one of the 61 files behaves as recorded
        env:
          GEOCOMP_KRUMM_DIR: krumm-corpus
        run: pytest -q tests/test_krumm_corpus.py tests/test_krumm.py
