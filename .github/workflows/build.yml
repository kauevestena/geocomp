# SPDX-License-Identifier: GPL-2.0-or-later
name: build

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]

env:
  # The RTKLIB-EX commit the plugin ships rnx2rtkp from (ADR-0009): the one the
  # parsers and the committed .pos fixtures were checked against, and the one
  # engine.yml builds. Change them together.
  RTKLIB_COMMIT: 06e8644287ff07efc4c53bbf3e7f9dafb0355605

jobs:
  # rnx2rtkp from the pinned commit, once per platform the plugin carries it for
  # (ADR-0009). Each runner builds it, checks what it links against, checks the
  # committed .pos fixtures against *that* binary, and runs it the way the
  # plugin will -- planted unexecutable under its platform name, found as the
  # bundled copy -- before it may ship.
  #
  # Linux is built on the oldest Ubuntu GeoComp supports, so it runs on that and
  # every later one (glibc is backward compatible, not forward), and linked
  # dynamically against libc and libm only: a static glibc would bring LGPL
  # relinking obligations. libgfortran is not linked; only the IERS tide model,
  # off in this build, uses it. Windows is linked statically with MinGW-w64, so
  # it needs no MinGW runtime DLLs beside it. macOS is one universal program,
  # Apple Silicon and Intel together; the runner checks its arm64 half natively
  # and its Intel half under Rosetta, and the package carries it for both.
  rtklib:
    name: rnx2rtkp for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            program: rnx2rtkp
          - os: windows-latest
            platform: windows-x86_64
            program: rnx2rtkp.exe
          - os: macos-latest
            platform: macos-universal
            program: rnx2rtkp
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the pinned source
        run: |
          git clone --filter=blob:none https://github.com/rtklibexplorer/RTKLIB.git rtklib-src
          git -C rtklib-src checkout --detach "$RTKLIB_COMMIT"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: make -C rtklib-src/app/consapp/rnx2rtkp/gcc -j"$(nproc)" LDLIBS="-lm"

      - name: Build (macOS, universal)
        if: runner.os == 'macOS'
        run: |
          make -C rtklib-src/app/consapp/rnx2rtkp/gcc -j"$(sysctl -n hw.ncpu)" \
            CC="clang -arch arm64 -arch x86_64" LDLIBS="-lm"
          lipo -info rtklib-src/app/consapp/rnx2rtkp/gcc/rnx2rtkp

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc make

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          # RTKLIB selects its Windows code with WIN32, which MinGW does not
          # define (it defines _WIN32); without it rtklib.h asks for sys/select.h.
          make -C rtklib-src/app/consapp/rnx2rtkp/gcc -j"$(nproc)" CC="gcc -DWIN32" \
            LDFLAGS="-static" LDLIBS="-lm"

      - name: Collect the program
        run: |
          mkdir engine
          cp "rtklib-src/app/consapp/rnx2rtkp/gcc/${{ matrix.program }}" engine/
          ls -l engine

      - name: What it links against (Linux)
        if: runner.os == 'Linux'
        run: |
          strip engine/rnx2rtkp
          ldd engine/rnx2rtkp
          extra=$(ldd engine/rnx2rtkp | awk '{print $1}' | grep -vE '^(linux-vdso|libc\.so|libm\.so|/lib64/ld-linux)' || true)
          if [ -n "$extra" ]; then
            echo "::error::rnx2rtkp links more than libc and libm: $extra"
            exit 1
          fi

      - name: What it links against (macOS)
        if: runner.os == 'macOS'
        run: |
          strip engine/rnx2rtkp
          otool -L engine/rnx2rtkp
          # A universal program lists its libraries once per architecture, each
          # under a header line; only the indented lines are libraries.
          extra=$(otool -L engine/rnx2rtkp | awk '/^[[:space:]]/{print $1}' | grep -vE '^/usr/lib/libSystem' || true)
          if [ -n "$extra" ]; then
            echo "::error::rnx2rtkp links more than libSystem: $extra"
            exit 1
          fi

      - name: What it links against (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          strip engine/rnx2rtkp.exe
          objdump -p engine/rnx2rtkp.exe | grep "DLL Name" | tee dlls.txt
          # Only DLLs every Windows has -- nothing from MinGW's runtime, which a
          # user would not have beside the program.
          extra=$(awk '{print $3}' dlls.txt | grep -viE '^(kernel32|msvcrt)\.dll$' || true)
          if [ -n "$extra" ]; then
            echo "::error::rnx2rtkp.exe needs more than KERNEL32 and msvcrt: $extra"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tooling
        run: python -m pip install --upgrade pip pytest numpy

      - name: The committed fixtures must match this very binary
        run: PATH="$PWD/engine:$PATH" python scripts/check_rtklib_fixtures.py

      # The Intel half of the universal program, which the Apple-Silicon runner
      # can only run translated. Through a wrapper, so the check above runs it
      # unchanged.
      - name: The Intel half must match them too, under Rosetta
        if: runner.os == 'macOS'
        run: |
          lipo -info engine/rnx2rtkp | grep -q x86_64
          softwareupdate --install-rosetta --agree-to-license || true
          mkdir rosetta
          printf '#!/bin/sh\nexec arch -x86_64 "%s" "$@"\n' "$PWD/engine/rnx2rtkp" > rosetta/rnx2rtkp
          chmod +x rosetta/rnx2rtkp
          PATH="$PWD/rosetta:$PATH" python scripts/check_rtklib_fixtures.py

      - name: The plugin must find it as its bundled copy, and run it
        env:
          GEOCOMP_BUNDLED_RNX2RTKP: ${{ github.workspace }}/engine/${{ matrix.program }}
        run: |
          python -m pytest -q -rs tests/test_bundled_engine.py -k TestARealBuildOnThisSystem | tee bundled.log
          if grep -q "SKIPPED" bundled.log; then
            echo "::error::the real-binary check skipped"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rnx2rtkp-${{ matrix.platform }}
          path: engine/${{ matrix.program }}

  package:
    name: plugin package
    needs: rtklib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One folder per platform: engine/rnx2rtkp-<platform>/<program>.
      - uses: actions/download-artifact@v4
        with:
          pattern: rnx2rtkp-*
          path: engine

      - name: The engines to carry
        run: |
          {
            echo -n "ENGINES=--engine rtklib=linux-x86_64:engine/rnx2rtkp-linux-x86_64/rnx2rtkp"
            echo -n " --engine rtklib=windows-x86_64:engine/rnx2rtkp-windows-x86_64/rnx2rtkp.exe"
            echo -n " --engine rtklib=macos-arm64:engine/rnx2rtkp-macos-universal/rnx2rtkp"
            echo " --engine rtklib=macos-x86_64:engine/rnx2rtkp-macos-universal/rnx2rtkp"
          } >> "$GITHUB_ENV"
          ls -lR engine

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt linguist tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-l10n-tools
          # Debian ships lrelease under a versioned name; expose the plain one.
          sudo ln -sf "$(ls /usr/lib/qt6/bin/lrelease)" /usr/local/bin/lrelease
          lrelease -version

      - name: Build
        run: python scripts/build.py $ENGINES

      - name: The archive must be reproducible
        run: |
          sha256sum dist/geocomp.zip | tee first.sha
          rm -rf dist
          python scripts/build.py $ENGINES
          sha256sum dist/geocomp.zip | tee second.sha
          if ! diff <(cut -d' ' -f1 first.sha) <(cut -d' ' -f1 second.sha); then
            echo "::error::Two builds of the same commit produced different archives"
            exit 1
          fi

      - name: Compiled translations must be in the archive
        run: |
          python - <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile("dist/geocomp.zip").namelist()
          qm = [n for n in names if n.endswith(".qm")]
          if not qm:
              sys.exit("no .qm translations in the archive; lrelease did not run")
          print("translations shipped:", qm)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: geocomp-plugin
          path: dist/geocomp.zip

  install:
    name: installs into QGIS
    needs: package
    runs-on: ubuntu-latest
    # The current stable release a user downloads, not the nightly build: the
    # archive is checked against the QGIS it will be installed into. The test
    # workflow's QGIS tier covers the LTR as well (specs/21 criterion 5).
    container:
      image: qgis/qgis:stable
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: geocomp-plugin

      # Not unzip(1): the QGIS image does not ship it, and python3 is the one
      # interpreter this job is already guaranteed to have.
      - name: Unpack into the QGIS plugin directory
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          plugins = Path.home() / ".local/share/QGIS/QGIS3/profiles/default/python/plugins"
          plugins.mkdir(parents=True, exist_ok=True)
          zipfile.ZipFile("geocomp.zip").extractall(plugins)
          metadata = plugins / "geocomp" / "metadata.txt"
          assert metadata.is_file(), f"{metadata} is missing after unpacking"
          print("unpacked into", plugins)
          PY

      - name: The plugin must load and register its provider
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.home() / ".local/share/QGIS/QGIS3/profiles/default/python/plugins"))

          from qgis.core import QgsApplication

          app = QgsApplication([], False)
          app.initQgis()

          from geocomp.provider import GeoCompProvider
          from geocomp.registry import ALGORITHMS

          provider = GeoCompProvider()
          QgsApplication.processingRegistry().addProvider(provider)

          registered = {a.id() for a in QgsApplication.processingRegistry().algorithms()
                        if a.provider().id() == "geocomp"}
          expected = {spec.id for spec in ALGORITHMS}
          assert registered == expected, f"expected {expected}, registered {registered}"
          print("provider registered", len(registered), "algorithm(s):", sorted(registered))

          app.exitQgis()
          PY

      # The point of ADR-0009: with nothing on PATH, the unpacked plugin finds
      # its own rnx2rtkp, runs it, and says where it came from. The unpacking
      # above is the same library QGIS uses, so the executable bit is as lost
      # here as it is on a user's machine.
      - name: The bundled rnx2rtkp must be found and run
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          command -v rnx2rtkp && { echo "::error::rnx2rtkp is on PATH; this check would prove nothing"; exit 1; } || true
          xvfb-run -a python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.home() / ".local/share/QGIS/QGIS3/profiles/default/python/plugins"))

          from qgis.core import QgsApplication

          app = QgsApplication([], False)
          app.initQgis()

          from geocomp.services.engines import rtklib_engine

          engine = rtklib_engine()
          path, source = engine.locate()
          assert source == "bundled", f"found {path} by {source}, not the bundled copy"
          version = engine.version()
          assert version is not None, "the bundled rnx2rtkp did not run"
          assert version.tested, f"{version.version} is not the version GeoComp was checked against"
          print("bundled", path, version.name, version.version)
          app.exitQgis()
          PY

  # Publishing a release in the GitHub interface is all it takes to give the
  # landing page's install step something to link to: the archive this very
  # run built and checked is attached to it. Its own job, so the wider token
  # exists only here, and only when a release is published.
  attach:
    name: attach the archive to the release
    needs: [package, install]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: geocomp-plugin

      - name: Attach geocomp.zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          sha256sum geocomp.zip | tee geocomp.zip.sha256
          gh release upload "$TAG" geocomp.zip geocomp.zip.sha256 --clobber --repo "$GITHUB_REPOSITORY"
