# SPDX-License-Identifier: GPL-2.0-or-later
#
# The engine tier: the one job that runs a real DynAdjust.
#
# Everything about the DynAdjust adapter is otherwise tested against committed
# fixtures, which is what keeps those tests tier 1 and runnable everywhere. The
# cost of that is drift: a DynAdjust that changed a column would keep passing
# against a fixture written by the old one. This job is the guard -- it
# regenerates every fixture with a real engine and fails if any of them moved.
#
# **Why it builds rather than downloads.** ADR-0003 prefers a pinned binary to a
# bundled one, and this would ideally fetch the official release and check its
# digest. Geoscience Australia's own release automation publishes Windows build
# artefacts and a `:latest` Docker Hub tag; neither is a versioned, digest-
# addressable Linux binary that can be pinned the way ADR-0003 asks. Building
# from a pinned commit is the option that *is* pinnable: the sha below is
# immutable, it is the build the fixtures were produced with, and it is the
# build specs/07 verified its claims against. The result is cached on that sha,
# so it is built once and reused until the pin changes.
name: engine

on:
  push:
    paths:
      - "geocomp/engines/**"
      - "geocomp/core/techniques/gnss/**"
      - "geocomp/core/geodesy/**"
      - "geocomp/core/models/**"
      - "geocomp/io/rinex.py"
      - "geocomp/io/gnss_discovery.py"
      - "tests/data/dynadjust/**"
      - "tests/data/rtklib/**"
      - "tests/data/rd06/**"
      - "tests/test_rd06.py"
      - "tests/test_gnss_baselines.py"
      - "tests/conftest.py"
      - "pyproject.toml"
      - "tests/test_dynadjust_*.py"
      - "tests/test_dyna*.py"
      - "tests/test_dna_reader.py"
      - "tests/test_engines.py"
      - "tests/test_rtklib_*.py"
      - "tests/test_pos_reader.py"
      - "tests/test_rinex.py"
      - "tests/test_gnss_discovery.py"
      - "scripts/check_dynadjust_fixtures.py"
      - "scripts/check_rtklib_fixtures.py"
      - "scripts/check_rd06.py"
      - ".gitattributes"
      - ".github/workflows/engine.yml"
  workflow_dispatch:

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

env:
  # DynAdjust 1.4.0. The fixtures in tests/data/dynadjust/output were produced
  # by this build, and specs/07-engine-dynadjust.md discharges its [C] claims
  # against this source. Changing it means re-running
  # scripts/check_dynadjust_fixtures.py --write and re-reading the diff, not
  # just bumping the sha.
  DYNADJUST_COMMIT: 5cdb89715c2e51f7036e4dd8ae67dac3a20fc7a8
  DYNADJUST_PKGS: libxerces-c-dev xsdcxx libboost-program-options-dev libopenblas-dev liblapacke-dev
  # RTKLIB-EX. The .pos fixtures in tests/data/rtklib/pos were produced by this
  # build, and specs/08 section 7.1 -- the column table, including the header
  # upstream labels wrongly -- was established against this source. Changing it
  # means re-running scripts/check_rtklib_fixtures.py --write and reading the
  # diff, not just bumping the sha.
  RTKLIB_COMMIT: 06e8644287ff07efc4c53bbf3e7f9dafb0355605

jobs:
  fixtures:
    name: fixtures match a real DynAdjust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: python -m pip install --upgrade pip pytest numpy

      - name: Cache the built engine
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: dynadjust-bin
          key: dynadjust-${{ runner.os }}-${{ env.DYNADJUST_COMMIT }}

      # Unconditional, and that is the point: the cache holds the binaries, not
      # the shared libraries they link against. Installing these inside the
      # build step meant a cache hit skipped them, and `dnaadjust` died with
      # `libboost_program_options.so.1.83.0: cannot open shared object file`
      # before a single fixture was compared -- so every run after the first
      # one failed, and the guard against fixture drift silently stopped
      # guarding. Roughly twenty seconds; the cache is there for the compile.
      - name: Install the engine's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $DYNADJUST_PKGS

      - name: Build DynAdjust from the pinned commit
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none https://github.com/GeoscienceAustralia/dynadjust.git upstream
          git -C upstream checkout --detach "$DYNADJUST_COMMIT"
          # Upstream's own recipe, from its build_and_test workflow.
          cd upstream
          cmake dynadjust -DBUILD_TESTING=OFF -DUSE_UNITY_BUILD=ON -DBLA_VENDOR=OpenBLAS
          make -j"$(nproc)"
          cd ..
          mkdir -p dynadjust-bin
          cp -a upstream/bin/. dynadjust-bin/

      - name: Report what is under test
        run: |
          echo "$PWD/dynadjust-bin" >> "$GITHUB_PATH"
          export PATH="$PWD/dynadjust-bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/dynadjust-bin:${LD_LIBRARY_PATH:-}"
          echo "LD_LIBRARY_PATH=$PWD/dynadjust-bin" >> "$GITHUB_ENV"
          dnaadjust --version

      # The check this job exists for: the committed fixtures must be exactly
      # what this engine produces from the committed inputs, timings aside.
      - name: Fixtures must match what the engine produces
        run: python3 scripts/check_dynadjust_fixtures.py

      # And the parsers themselves, so a failure here separates "the fixtures
      # moved" from "the parsers broke".
      - name: The DynAdjust adapter's own tests
        run: pytest -q tests/test_engines.py tests/test_dynaml_writer.py
             tests/test_dynaml_reader.py tests/test_dna_reader.py
             tests/test_dynadjust_output.py tests/test_dynadjust_solution.py

      # The tier-4 tests proper: what only a running engine can show, and the
      # evidence behind P6's cross-validation criterion. This file was missing
      # from the list above, so every test in it -- the whole pipeline reaching
      # a Solution, the provenance, the projected-network cross-validation --
      # had never run in CI. A tier-4 test that only ever runs on a
      # contributor's machine is a claim, not a check.
      - name: The pipeline, against the real engine
        run: pytest -q tests/test_dynadjust_pipeline.py

  # The same shape as the job above, for the second engine. rnx2rtkp has no
  # pinnable Linux binary to install: upstream publishes Windows executables
  # only (readme.txt), so building from a pinned commit is the option that *is*
  # pinnable, exactly as ADR-0003's reasoning runs for DynAdjust.
  rtklib:
    name: fixtures match a real rnx2rtkp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: python -m pip install --upgrade pip pytest numpy -r tests/data/rd06/requirements.txt

      - name: Cache the built engine
        id: rtklib-cache
        uses: actions/cache@v4
        with:
          path: rtklib-bin
          key: rtklib-${{ runner.os }}-${{ env.RTKLIB_COMMIT }}

      # Unconditional, like the DynAdjust job's, and for the same reason: the
      # cache holds the binary, not what it links against. rnx2rtkp links
      # -lgfortran, which is not in the runner image, and a cache hit that
      # skipped this step would leave every run after the first one failing on
      # a missing shared library.
      - name: Install the engine's runtime library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran

      - name: Build rnx2rtkp from the pinned commit
        if: steps.rtklib-cache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none https://github.com/rtklibexplorer/RTKLIB.git rtklib-src
          git -C rtklib-src checkout --detach "$RTKLIB_COMMIT"
          make -C rtklib-src/app/consapp/rnx2rtkp/gcc -j"$(nproc)"
          mkdir -p rtklib-bin
          cp rtklib-src/app/consapp/rnx2rtkp/gcc/rnx2rtkp rtklib-bin/

      - name: Report what is under test
        run: |
          echo "$PWD/rtklib-bin" >> "$GITHUB_PATH"
          export PATH="$PWD/rtklib-bin:$PATH"
          rnx2rtkp --version

      # The check this job exists for. The .pos column layout is not documented
      # anywhere GeoComp can cite -- it was read out of src/solution.c and
      # confirmed by running the engine four ways -- so a parser built on that
      # reading has to be told the day the reading stops being true.
      - name: Fixtures must match what the engine produces
        run: python3 scripts/check_rtklib_fixtures.py

      # The parsers themselves, so a failure separates "the fixtures moved"
      # from "the parsers broke".
      - name: The RTKLIB adapter's own tests
        run: pytest -q tests/test_rinex.py tests/test_gnss_discovery.py
             tests/test_pos_reader.py tests/test_rtklib_engine.py

      # And the tier-4 tests proper: what only a running engine shows, which is
      # that the configuration GeoComp writes is one rnx2rtkp accepts and that
      # the chain from a folder of RINEX to a fixed solution runs.
      - name: The pipeline, against the real engine
        run: pytest -q tests/test_rtklib_engine.py -k AgainstTheRealEngine

      # The published-coordinate criterion is still unmet. Local pytest names
      # its known failure; --runxfail here enforces the original assertion and
      # deliberately leaves this check red until the discrepancy is resolved.
      # Never continue-on-error: processing/repeatability and accuracy matter.
      - name: Acquire RD-06 processing inputs and enforce their recorded hashes
        run: python3 scripts/check_rd06.py --fetch-inputs --verify-inputs

      - name: RD-06 must reproduce the published NGS coordinates
        env:
          GEOCOMP_RD06_REQUIRED: "1"
          GEOCOMP_RD06_OUTPUT: build/rd06
        run: pytest -q tests/test_rd06.py --runxfail --junitxml=build/rd06/junit.xml

      # The one experiment the development environment cannot run: geodesy.noaa.gov,
      # which serves ngs20.atx, is denied by its egress policy, so the sweep there is
      # the uncalibrated configuration. Here the calibration is present, and a
      # calibrated sweep at a high elevation mask is what separates residual antenna
      # calibration from a real disagreement with the published coordinates
      # (specs/22 section 5).
      #
      # It exits zero whatever the numbers say -- it reports, it does not judge --
      # so the only way it fails is a bug in the diagnostic itself, and that should
      # be visible. It ran under `continue-on-error` exactly once, where it hid its
      # own missing-ANTEX bug as a two-second success.
      - name: RD-06 diagnostic — the calibrated elevation-mask sweep
        if: always()
        run: python3 scripts/check_rd06.py --sweep --output build/rd06-sweep

      - name: Retain RD-06 configurations, solutions, logs and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rd06-validation
          path: |
            build/rd06/*/*.pos
            build/rd06/*/*.conf
            build/rd06/*/*.txt
            build/rd06/*/*.json
            build/rd06/metrics.json
            build/rd06/junit.xml
            build/rd06-sweep/sweep.json
          if-no-files-found: warn
